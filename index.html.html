<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Primed Studio | Motion videos from $150</title>
<meta name="description" content="Motion videos for fintech, legaltech, proptech, AI and SaaS teams. Explainer, promo, ad, tradeshow and how-to demo videos from $150.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#030806;--ink:#F4FFF9;--muted:#B9D2C5;--g:#0BF27A;--c:#12E8F2;--btn-ink:#03140C;
  --grad:linear-gradient(90deg,#12E8F2,#0BF27A);
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{-webkit-text-size-adjust:100%;font:400 1.0625rem/1.55 var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;
  background:radial-gradient(75% 34rem at 50% 0,#0B3D2D 0,transparent 72%),
             radial-gradient(70% 36rem at 50% 58rem,#0A4630 0,transparent 72%),var(--bg)}
a{color:inherit}
:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.wrap{width:min(1100px,100% - 2*max(1.25rem,env(safe-area-inset-left)));margin-inline:auto}
section{padding:clamp(3rem,8vw,6rem) 0;text-align:center}
h1,h2{font-weight:800;letter-spacing:-.03em;line-height:1.06;text-wrap:balance}
.sub,.quote,.lines span{text-wrap:balance}
h2{font-size:clamp(2rem,5.2vw,3.5rem)}
.sub{color:var(--muted);max-width:34rem;margin:1rem auto 0}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:.8rem 1.7rem;border-radius:4px;
  background:var(--g);color:var(--btn-ink);font:700 1.1rem var(--font);text-decoration:none;transition:transform .15s,filter .15s}
.btn.cy{background:var(--c)}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}

.nav{position:sticky;top:.75rem;z-index:30;margin-top:clamp(.75rem,2vw,1.5rem);display:flex;align-items:center;gap:clamp(1rem,3vw,2.5rem);
  padding:.55rem .55rem .55rem 1.25rem;border-radius:999px;background:rgba(14,19,17,.92);border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:.6rem;font:800 1.3rem var(--font);letter-spacing:-.03em;text-decoration:none;white-space:nowrap}
.brand svg{width:34px;height:34px;flex:none}
.links{display:flex;gap:clamp(1rem,2.6vw,2.25rem);margin-right:auto;margin-left:.5rem}
.links a{white-space:nowrap;font-weight:600;font-size:1rem;text-decoration:none;color:var(--ink);opacity:.9;padding:.4rem 0}
.links a:hover{color:var(--g)}
.nav .btn{white-space:nowrap;border-radius:999px;min-height:38px;padding:.4rem 1.2rem;font-size:.9rem;margin-left:auto}
.links + .btn{margin-left:0}
section{scroll-margin-top:5.5rem}
.hero{padding-top:clamp(3rem,9vw,7rem)}
.hero h1{font-size:clamp(1.7rem,8.2vw,5rem)}
.hero h1 span{display:block}
.hero .lines{margin:1.75rem auto 2rem;font-size:1.1rem}
.hero .lines span{display:block}
.row{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.25rem}
.tile{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:6px;background:#0d1511}
.tile video,.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile video{opacity:0;transition:opacity .4s}
.tile video.ready{opacity:1}
.ph{display:grid;place-items:center;padding:1rem;font-weight:800;font-size:clamp(1.1rem,2.6vw,1.9rem);letter-spacing:-.02em}
.ph small{display:block;font:500 .78rem var(--font);opacity:.7;margin-top:.35rem;letter-spacing:0}
.tile video.ready ~ .ph{display:none}
.p1{background:linear-gradient(135deg,#F3F6F5,#DDE8E4);color:#16302A}
.p2{background:linear-gradient(135deg,#E6FBE3,#C8F5CF);color:#0F4B2E}
.p3{background:radial-gradient(circle at 70% 20%,#0E7A3B,#040a07 65%);color:#fff}
.p4{background:linear-gradient(135deg,#F6FFFB,#E3F7EF);color:#0F4B2E}

.quote{max-width:40rem;margin:1.75rem auto 0;font-size:1.15rem}
.who{margin-top:2rem;display:grid;justify-items:center;gap:.5rem}
.avatar{width:56px;height:56px;border-radius:4px;background:#D0D0D0}
.who strong{display:block;font-weight:700}
.who span{font-size:.9rem;color:var(--muted)}

.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(1.5rem,4vw,3rem);max-width:960px;margin:3rem auto 0;text-align:left}
.plan{display:flex;flex-direction:column;gap:.35rem}
.plan .amt{font-size:clamp(2.2rem,4.5vw,3rem);font-weight:800;letter-spacing:-.03em;line-height:1}
.plan h3{font-size:1.15rem;font-weight:700}
.plan p{color:var(--muted);margin-bottom:1.5rem}
.plan .btn{margin-top:auto;align-self:flex-start}

.ai .btn{margin-top:2rem}
footer{padding:2rem 0 2.5rem;text-align:center;color:var(--muted);font-size:.9rem}
.social{display:flex;justify-content:center;gap:.9rem}
.social
